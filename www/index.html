<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Manager</title>
  <link rel="stylesheet" href="./styles/style.css">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  
  <header class="header">
    <div class="information-box">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-lock-keyhole preview-icon">
        <circle cx="12" cy="16" r="1" />
        <rect x="3" y="10" width="18" height="12" rx="2" />
        <path d="M7 10V7a5 5 0 0 1 10 0v3" />
      </svg>
      <h1 class="header__title">Pass Saver</h1>
    </div>

    <div class="button-container">
      <button class="button-container__btn">Add categorie</button>
      <button class="button-container__btn">Add site</button>
    </div>
  </header>

  <main>
    <aside class="aside">
      <h2 class="aside__title">Categories</h2>
      <ul>
      </ul>
    </aside>

    <table class="table">
      <thead>
        <tr>
          <th scope="col">Site</th>
          <th scope="col">User</th>
          <th scope="col">Created at</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
    </table>
  </main>
</body>

</html>
