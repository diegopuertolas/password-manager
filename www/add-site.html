<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add a site</title>
  <link rel="icon" href="./assets/password-icon.svg" type="image/svg">
  <link rel="stylesheet" href="./styles/add-site.css">
</head>
<body>
  <header class="header">
    <h1 class="header__title">Pass Server · Add Site</h1>
  </header>

  <main class="form-main">
    <form id="site-form" class="site-form">
      <label for="site-name">Name *</label>
      <input type="text" id="site-name" placeholder="Ex. Google">
      <p id="name-error" class="error-msg"></p>

      <label for="site-url">URL</label>
      <input type="text" id="site-url" placeholder="https://google.com">

      <label for="site-user">User *</label>
      <input type="text" id="site-user" placeholder="Your user">
      <p id="user-error" class="error-msg"></p>

      <div>
        <label for="site-password">Password *</label>
        <button type="button" class="generate-password-btn" id="generate-password-btn">
          <img src="./assets/star-icon.svg" alt="Icono de generar contraseña">
        </button>
      </div>
      <input type="password" id="site-password" placeholder="Your password">
      <button type="button" id="toggle-password-btn" class="toggle-password-btn">
        <img src="./assets/eye.svg" id="toggle-password-icon" alt="Show password">
      </button>
      <p id="password-error" class="error-msg"></p>

      <label for="site-description">Description</label>
      <textarea type="text" id="site-description" rows="4" placeholder="Description.."></textarea>

      <div class="actions-buttons">
        <button type="submit" class="actions-buttons__btn">Save</button>
        <button type="button" id="btn-cancel" class="actions-buttons__btn">Cancel</button>
      </div>
    </form>
  </main>

  <script type="module" src="./scripts/add-site.js"></script>
</body>
</html>
